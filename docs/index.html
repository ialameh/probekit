<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProbeKit · Free Salesforce tools by OrgParity</title>
<meta name="description" content="Free Salesforce tools from OrgParity. Investigate field access in your browser and browse 73 reusable probes for metadata, permissions, flows and data.">
<link rel="canonical" href="https://probekit.orgparity.com/">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6878; --line: #e2e6ec;
  --accent: #176450; --accent-soft: #e9eee5; --code-bg: #f1f3f7; --warn: #8a5a00; --warn-soft: #fff4dc;
  --ok: #1f7a4d; --ok-soft: #e3f4ea; --danger: #a8322a; --danger-soft: #fbe7e5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a313c;
    --accent: #7aa2ff; --accent-soft: #1f2a44; --code-bg: #141920; --warn: #f0c060; --warn-soft: #3a2f16;
    --ok: #6fd3a0; --ok-soft: #173326; --danger: #ff8a80; --danger-soft: #3a1c1a;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f27; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a313c;
  --accent: #7aa2ff; --accent-soft: #1f2a44; --code-bg: #141920; --warn: #f0c060; --warn-soft: #3a2f16;
  --ok: #6fd3a0; --ok-soft: #173326; --danger: #ff8a80; --danger-soft: #3a1c1a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
header .spacer { flex: 1; }
header { flex-wrap: wrap; }
header nav { display: flex; flex-wrap: wrap; gap: 12px; }
.brand-note { display: block; font-size: 11px; font-weight: normal; }
.start-here { padding: 12px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 14px; }
a { color: var(--accent); }
body { display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); }
main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); flex: 1; min-height: 0; }
#side, #detail { min-width: 0; }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.search { padding: 12px 12px 8px; }
.search input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sortbar { display: flex; justify-content: space-between; align-items: center; padding: 0 12px 8px; color: var(--muted); font-size: 12px; }
#list { overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
.item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.item .q { color: var(--muted); font-size: 13px; margin-top: 2px; }
.item .meta { display: flex; gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.empty { padding: 24px 12px; color: var(--muted); }
#detail { overflow-y: auto; padding: 20px 28px 48px; min-width: 0; }
.crumb { font-family: var(--mono); color: var(--muted); font-size: 12.5px; }
#detail h2 { font-size: 20px; margin: 4px 0 10px; line-height: 1.3; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--line); }
.tag.read { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.writes { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
section { margin: 22px 0; }
section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 8px; }
.param label { display: block; font-family: var(--mono); font-size: 12.5px; margin-bottom: 3px; }
.param label small { font-family: var(--sans); color: var(--muted); font-weight: normal; }
.param input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-family: var(--mono); font-size: 12.5px; }
.param input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.row label { font-size: 12.5px; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
.row input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-family: var(--mono); font-size: 12.5px; width: 120px; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
.codewrap { position: relative; }
.copy { position: absolute; top: 6px; right: 6px; font-size: 11.5px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.kw { color: var(--accent); font-weight: 600; }
.ph { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 2px; }
.ref { background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }
.step { margin-bottom: 14px; }
.step .head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.step .name { font-family: var(--mono); font-weight: 600; }
.step .when { font-size: 12px; color: var(--muted); }
.step .when code, .verdict code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.verdict { padding: 8px 10px; border-left: 3px solid var(--line); margin-bottom: 6px; background: var(--panel); border-radius: 0 6px 6px 0; }
.verdict .say { margin-top: 2px; }
.verdict.fallback { border-left-color: var(--accent); }
ul.traps { margin: 0; padding-left: 18px; }
ul.traps li { margin-bottom: 4px; }
.note { color: var(--muted); font-size: 12.5px; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  header { padding: 10px 16px; }
  .search, .filters, .sortbar { padding-left: 16px; padding-right: 16px; }
  .params { grid-template-columns: minmax(0, 1fr); }
  #side { border-right: 0; max-height: 55vh; }
  #detail { padding: 16px; }
  header .count { display: none; }
}
.release-version{font:600 12px var(--sans);border:1px solid var(--line);border-radius:4px;padding:3px 7px;white-space:nowrap}
</style>
</head>

lder(s)."}],"traps":[],"source":"tool","logged":0},{"id":"access.dormant-users","question":"Which active users have no recorded login or last logged in before the selected window?","family":"access","params":{"days":{"type":"int","example":"90","default":"90"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"users","soql":"SELECT Id, Username, IsActive, UserType, LastLoginDate, CreatedDate FROM User WHERE IsActive = true AND (LastLoginDate = null OR LastLoginDate \u003c LAST_N_DAYS:{days}) ORDER BY LastLoginDate ASC NULLS FIRST LIMIT {limit}"}],"verdicts":[{"say":"{users.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["LastLoginDate is a limited activity signal, not proof a user is unused.","A null login date can include newly provisioned users. No automatic deactivation is recommended."],"source":"tool","logged":0},{"id":"access.expiring-assignments","question":"Which active users have expiring, inactive or revoked permission assignments?","family":"access","params":{"days":{"type":"int","example":"30","default":"30"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"assignments","soql":"SELECT AssigneeId, Assignee.Username, PermissionSet.Name, PermissionSetGroup.DeveloperName, ExpirationDate, IsActive, IsRevoked FROM PermissionSetAssignment WHERE Assignee.IsActive = true AND (IsActive = false OR IsRevoked = true OR ExpirationDate \u003c= TODAY OR ExpirationDate = NEXT_N_DAYS:{days}) ORDER BY ExpirationDate ASC NULLS LAST LIMIT {limit}"}],"verdicts":[{"say":"{assignments.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["NEXT_N_DAYS follows Salesforce relative-date boundaries. Dates, query identity and time of export matter.","Inactive or revoked assignments may have no expiration date. Group muting and other grants remain separate.","Empty results are not proof that no access will expire."],"source":"tool","logged":0},{"id":"access.field-grants","question":"Who can read and edit this field, and is that access assigned to the user?","family":"access","rule":"Check access before code: grants, then assignment, then page visibility.","params":{"obj":{"type":"sobject","example":"Account"},"field":{"type":"field","example":"Industry"},"user":{"type":"username","optional":true,"example":"jane.doe@example.com"}},"safety":{"writes":false},"steps":[{"name":"grants","soql":"SELECT Parent.Name, Parent.IsOwnedByProfile, Parent.Profile.Name, PermissionsRead, PermissionsEdit FROM FieldPermissions WHERE SobjectType = '{obj}' AND Field = '{obj}.{field}' ORDER BY Parent.Name","compare":["Parent.Name","PermissionsRead","PermissionsEdit"]},{"name":"field_exists","when":"grants.rows === 0","tooling":true,"soql":"SELECT QualifiedApiName, DataType FROM FieldDefinition WHERE EntityDefinition.QualifiedApiName = '{obj}' AND QualifiedApiName = '{field}'","compare":["QualifiedApiName","DataType"]},{"name":"assignments","when":"user !== undefined","soql":"SELECT PermissionSet.Name, PermissionSet.IsOwnedByProfile, PermissionSetGroup.DeveloperName FROM PermissionSetAssignment WHERE Assignee.Username = '{user}'"}],"verdicts":[{"when":"field_exists.rows === 0","say":"{obj}.{field} does not exist on this org."},{"when":"grants.rows === 0","say":"{obj}.{field} exists, but nothing grants access to it. Raise with the permissions owner."},{"when":"assignments.rows > 0 && overlap(grants.col('Parent.Name'), assignments.col('PermissionSet.Name')) === 0","say":"Grants exist, but none is assigned to {user}. Raise with the permissions owner."},{"when":"assignments.rows > 0","say":"{user} holds a grant on {obj}.{field}. Next check page, component and record-type visibility."},{"say":"{grants.rows} permission set(s) or profile(s) carry a grant. Pass --user to check one person."}],"traps":["describe is filtered by field access: a field you cannot see reads as missing. Prove existence with FieldDefinition.","Profile grants appear here as a permission set with IsOwnedByProfile true.","A permission set deploy replaces the whole set, it does not add to it."],"source":"tool","logged":0},{"id":"access.frozen-users","question":"Which user logins are frozen, and which returned users are still active?","family":"access","params":{"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"logins","soql":"SELECT UserId, IsFrozen FROM UserLogin WHERE IsFrozen = true LIMIT {limit}"},{"name":"users","soql":"SELECT Id, Username, IsActive, UserType FROM User WHERE Id IN ({@logins.UserId}) ORDER BY Username","when":"logins.rows > 0"}],"verdicts":[{"say":"{logins.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["The second query resolves the bounded first export only.","This is an administrative review; a freeze may be deliberate."],"source":"tool","logged":0},{"id":"access.group-health","question":"Which permission-set groups have not reached Updated status?","family":"access","params":{"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"groups","soql":"SELECT DeveloperName, MasterLabel, Status, LastModifiedDate FROM PermissionSetGroup WHERE Status != 'Updated' ORDER BY LastModifiedDate DESC LIMIT {limit}"}],"verdicts":[{"say":"{groups.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["Status describes an export-time snapshot. Calculation may complete after the query.","Effective permissions also depend on muting, assignment and other grants."],"source":"tool","logged":0},{"id":"access.group-members","question":"Who is in this public group or queue, and which objects does the queue serve?","family":"access","params":{"group":{"type":"name","example":"Sales_Queue"}},"safety":{"writes":false},"steps":[{"name":"grp","soql":"SELECT Id, DeveloperName, Name, Type FROM Group WHERE DeveloperName = '{group}'"},{"name":"members","when":"grp.rows > 0","soql":"SELECT UserOrGroupId, GroupId FROM GroupMember WHERE GroupId IN ({@grp.Id})"},{"name":"users","compare":["Username","IsActive"],"when":"members.rows > 0","soql":"SELECT Name, Username, IsActive FROM User WHERE Id IN ({@members.UserOrGroupId}) ORDER BY Name"},{"name":"queue_objects","compare":["SobjectType"],"when":"grp.rows > 0","soql":"SELECT SobjectType FROM QueueSobject WHERE QueueId IN ({@grp.Id})"}],"verdicts":[{"when":"grp.rows === 0","say":"No group or queue {group}."},{"say":"{group} has {members.rows} member(s): {users.rows} user(s), the rest are groups or roles."}],"traps":[],"source":"tool","logged":0},{"id":"access.license-capacity","question":"What user licence allocations and usage are reported by this org?","family":"access","params":{"limit":{"type":"int","example":"100","default":"100"}},"safety":{"writes":false},"steps":[{"name":"licenses","soql":"SELECT Name, Status, TotalLicenses, UsedLicenses, UsedLicensesLastUpdated FROM UserLicense ORDER BY Name LIMIT {limit}","compare":["Name","Status","TotalLicenses","UsedLicenses"]}],"verdicts":[{"say":"{licenses.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["Zero or special licence totals must not be used as a percentage denominator.","Usage is reported data, not a purchasing recommendation or proof that a user can be provisioned."],"source":"tool","logged":0},{"id":"access.logins","question":"When and how did this user last log in?","family":"access","params":{"user":{"type":"username","example":"jane.doe@example.com"},"limit":{"type":"int","example":"20","default":"20"}},"safety":{"writes":false},"steps":[{"name":"u","soql":"SELECT Id FROM User WHERE Username = '{user}'"},{"name":"logins","when":"u.rows === 1","soql":"SELECT LoginTime, Status, Application, LoginType, Platform, Browser FROM LoginHistory WHERE UserId IN ({@u.Id}) ORDER BY LoginTime DESC LIMIT {limit}"}],"verdicts":[{"when":"u.rows === 0","say":"No user {user}."},{"when":"logins.rows === 0","say":"No logins recorded for {user}."},{"say":"Last login {= logins.records[0].LoginTime}: {= logins.records[0].Status}."}],"traps":[],"source":"tool","logged":0},{"id":"access.object-grants","question":"Which profiles and permission sets grant access to this object, and at what level?","family":"access","params":{"obj":{"type":"sobject","example":"Account"}},"safety":{"writes":false},"steps":[{"name":"grants","compare":["Parent.Name","PermissionsRead","PermissionsCreate","PermissionsEdit","PermissionsDelete"],"soql":"SELECT Parent.Name, Parent.IsOwnedByProfile, Parent.Profile.Name, PermissionsRead, PermissionsCreate, PermissionsEdit, PermissionsDelete, PermissionsViewAllRecords, PermissionsModifyAllRecords FROM ObjectPermissions WHERE SobjectType = '{obj}' ORDER BY Parent.Name"}],"verdicts":[{"when":"grants.rows === 0","say":"Nothing grants access to {obj}."},{"say":"{grants.rows} profile(s) or permission set(s) grant access to {obj}."}],"traps":["Profile grants appear as a permission set with IsOwnedByProfile true."],"source":"tool","logged":0},{"id":"access.permission-license-capacity","question":"What permission-set licence allocations, usage and expiry dates are reported?","family":"access","params":{"limit":{"type":"int","example":"100","default":"100"}},"safety":{"writes":false},"steps":[{"name":"licenses","soql":"SELECT DeveloperName, MasterLabel, Status, TotalLicenses, UsedLicenses, ExpirationDate FROM PermissionSetLicense ORDER BY DeveloperName LIMIT {limit}","compare":["DeveloperName","Status","TotalLicenses","UsedLicenses","ExpirationDate"]}],"verdicts":[{"say":"{licenses.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["Permission-set licences differ from user licences. Availability alone does not grant access.","Zero or special totals need separate interpretation; expiry is date-based."],"source":"tool","logged":0},{"id":"access.permset-group","question":"What is inside this permission set group, and has it finished recalculating?","family":"access","params":{"group":{"type":"name","example":"Sales_Team"}},"safety":{"writes":false},"steps":[{"name":"grp","compare":["DeveloperName","Status"],"soql":"SELECT Id, DeveloperName, MasterLabel, Status, CreatedBy.Name, CreatedDate, LastModifiedBy.Name, LastModifiedDate FROM PermissionSetGroup WHERE DeveloperName = '{group}'"},{"name":"components","compare":["PermissionSet.Name"],"when":"grp.rows === 1","soql":"SELECT PermissionSet.Name, PermissionSet.Label FROM PermissionSetGroupComponent WHERE PermissionSetGroup.DeveloperName = '{group}' ORDER BY PermissionSet.Name"}],"verdicts":[{"when":"grp.rows === 0","say":"No permission set group {group}."},{"when":"grp.records[0].Status !== 'Updated'","say":"{group} status is {= grp.records[0].Status}: grants are not final until it reads Updated."},{"say":"{group} holds {components.rows} permission set(s) and is up to date."}],"traps":["A muting permission set in the group removes grants; it appears here as a component."],"source":"tool","logged":0},{"id":"access.permset-holders","question":"Who holds this permission set or permission set group?","family":"access","params":{"permset":{"type":"name","example":"Sales_Operations"},"limit":{"type":"int","example":"500","default":"500"}},"safety":{"writes":false},"steps":[{"name":"holders","compare":["Assignee.Name","Assignee.IsActive"],"soql":"SELECT Assignee.Name, Assignee.Username, Assignee.IsActive, PermissionSet.Name, PermissionSetGroup.DeveloperName, ExpirationDate FROM PermissionSetAssignment WHERE PermissionSet.Name = '{permset}' OR PermissionSetGroup.DeveloperName = '{permset}' ORDER BY Assignee.Name LIMIT {limit}"}],"verdicts":[{"when":"holders.rows === 0","say":"Nobody holds {permset}, or no permission set or group has that name."},{"say":"{holders.rows} assignment(s), {= holders.records.filter(r => r[\"Assignee.IsActive\"]).length} to active users."}],"traps":["A user given a group appears once per permission set inside the group."],"source":"tool","logged":0},{"id":"access.permset","question":"What is this permission set: licence, type, key system permissions, and how much does it grant?","family":"access","params":{"permset":{"type":"name","example":"Sales_Operations"}},"safety":{"writes":false},"steps":[{"name":"ps","compare":["Name","Type","License.Name","PermissionsModifyAllData","PermissionsViewAllData","PermissionsApiEnabled"],"soql":"SELECT Id, Name, Label, Type, License.Name, IsCustom, NamespacePrefix, PermissionsModifyAllData, PermissionsViewAllData, PermissionsApiEnabled, PermissionsCustomizeApplication, CreatedBy.Name, CreatedDate, LastModifiedBy.Name, LastModifiedDate FROM PermissionSet WHERE Name = '{permset}'"},{"name":"objects","compare":["SobjectType","PermissionsRead","PermissionsEdit","PermissionsDelete"],"when":"ps.rows === 1","soql":"SELECT SobjectType, PermissionsRead, PermissionsEdit, PermissionsDelete FROM ObjectPermissions WHERE ParentId IN ({@ps.Id}) ORDER BY SobjectType"},{"name":"fields","compare":["Field","PermissionsRead","PermissionsEdit"],"when":"ps.rows === 1","soql":"SELECT Field, PermissionsRead, PermissionsEdit FROM FieldPermissions WHERE ParentId IN ({@ps.Id}) ORDER BY Field"}],"verdicts":[{"when":"ps.rows === 0","say":"No permission set {permset}."},{"when":"ps.records[0].PermissionsModifyAllData","say":"{permset} grants Modify All Data."},{"say":"{permset}: {objects.rows} object grant(s), {fields.rows} field grant(s)."}],"traps":["Run on two orgs to see grant drift; a permission set deploy replaces the whole set, so drift here is what a deploy would overwrite."],"source":"tool","logged":0},{"id":"access.record-access","question":"What access does this user have to this record, as the platform calculates it?","family":"access","params":{"user":{"type":"username","example":"jane.doe@example.com"},"record":{"type":"id","example":"001000000000000AAA"}},"safety":{"writes":false},"steps":[{"name":"u","soql":"SELECT Id FROM User WHERE Username = '{user}'"},{"name":"access","when":"u.rows === 1","soql":"SELECT RecordId, HasReadAccess, HasEditAccess, HasDeleteAccess, HasTransferAccess, MaxAccessLevel FROM UserRecordAccess WHERE UserId = {@u.Id} AND RecordId = '{record}'"}],"verdicts":[{"when":"u.rows === 0","say":"No user {user}."},{"when":"access.rows === 0 || !access.records[0].HasReadAccess","say":"{user} cannot read {record}."},{"say":"{user} has {= access.records[0].MaxAccessLevel} access to {record}."}],"traps":["This is the sharing answer only. Field access is separate (access.field-grants)."],"source":"tool","logged":0},{"id":"access.record-shares","question":"Which share rows open this record, to whom, and why?","family":"access","params":{"share":{"type":"sobject","example":"AccountShare"},"parent":{"type":"field","example":"AccountId"},"level":{"type":"field","example":"AccountAccessLevel"},"record":{"type":"id","example":"001000000000000AAA"}},"safety":{"writes":false},"steps":[{"name":"shares","compare":["UserOrGroup.Name","RowCause"],"soql":"SELECT UserOrGroupId, UserOrGroup.Name, {level}, RowCause, LastModifiedDate FROM {share} WHERE {parent} = '{record}' ORDER BY RowCause"}],"verdicts":[{"when":"shares.rows === 0","say":"No share rows on {record}."},{"say":"{shares.rows} share row(s) on {record}."}],"traps":["Standard objects name the parent and level fields after the object (AccountId, AccountAccessLevel); custom share objects use ParentId and AccessLevel."],"source":"tool","logged":0},{"id":"access.tab-settings","question":"Which permission sets and profiles show or hide this tab?","family":"access","params":{"tab":{"type":"nam CT Subject, Status, Incoming, MessageDate, CreatedBy.Name FROM EmailMessage WHERE RelatedToId = '{id}' ORDER BY MessageDate DESC LIMIT {limit}"}],"verdicts":[{"when":"emails.rows === 0","say":"No emails logged against {id}."},{"say":"{emails.rows} email(s) logged against {id}."}],"traps":["An email sent by automation is logged here when the send logs activity; a missing row does not prove the email was not sent."],"source":"tool","logged":0},{"id":"data.files","question":"Which files are attached to this record, and who can see them?","family":"data","params":{"id":{"type":"id","example":"001000000000000AAA"}},"safety":{"writes":false},"steps":[{"name":"files","soql":"SELECT ContentDocument.Title, ContentDocument.FileExtension, ContentDocument.ContentSize, ShareType, Visibility, ContentDocument.LastModifiedDate FROM ContentDocumentLink WHERE LinkedEntityId = '{id}' ORDER BY ContentDocument.LastModifiedDate DESC"}],"verdicts":[{"when":"files.rows === 0","say":"No files on {id}."},{"say":"{files.rows} file(s) on {id}."}],"traps":["Visibility AllUsers is needed for portal and community users to see a file."],"source":"tool","logged":0},{"id":"data.find","question":"Which records of this object have this value in this field?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"field":{"type":"field","example":"Name"},"value":{"type":"text","example":"Acme Ltd","optional":true},"like":{"type":"text","example":"Acme%","optional":true},"fields":{"type":"fields","example":"Id, Name, CreatedDate, LastModifiedDate","default":"Id, CreatedBy.Name, CreatedDate, LastModifiedBy.Name, LastModifiedDate"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"records","soql":"SELECT {fields} FROM {obj} WHERE Id != null [[AND {field} = '{value}']] [[AND {field} LIKE '{like}']] ORDER BY CreatedDate DESC LIMIT {limit}"}],"verdicts":[{"when":"records.rows === 0","say":"No {obj} matched."},{"say":"{records.rows} {obj} record(s) matched."}],"traps":["Pass --value for an exact match or --like with % for a pattern."],"source":"tool","logged":0},{"id":"data.history","question":"How did the tracked fields of this record change over time?","family":"data","params":{"history":{"type":"sobject","example":"AccountHistory"},"parent":{"type":"field","example":"AccountId"},"id":{"type":"id","example":"001000000000000AAA"},"limit":{"type":"int","example":"100","default":"100"}},"safety":{"writes":false},"steps":[{"name":"changes","soql":"SELECT Field, OldValue, NewValue, CreatedBy.Name, CreatedDate FROM {history} WHERE {parent} = '{id}' ORDER BY CreatedDate DESC LIMIT {limit}"}],"verdicts":[{"when":"changes.rows === 0","say":"No tracked changes on {id}."},{"say":"{changes.rows} tracked change(s) on {id}."}],"traps":["Only tracked fields appear, from the day tracking was switched on.","Standard objects: \u003cObject>History with \u003cObject>Id. Custom objects: \u003cObject>__History with ParentId."],"source":"tool","logged":0},{"id":"data.inactive-owners","question":"Which records on this object belong to inactive users?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"records","soql":"SELECT Id, OwnerId, Owner.Name, LastModifiedDate FROM {obj} WHERE OwnerId IN (SELECT Id FROM User WHERE IsActive = false) ORDER BY LastModifiedDate DESC LIMIT {limit}"}],"verdicts":[{"say":"{records.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["The selected object must support OwnerId and LastModifiedDate. Queue ownership is excluded.","Visibility and the query limit constrain results. Inactive ownership is not proof the record is abandoned."],"source":"tool","logged":0},{"id":"data.missing-values","question":"Which records lack a value in the selected field?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"field":{"type":"field","example":"Industry"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"records","soql":"SELECT Id, {field}, LastModifiedDate FROM {obj} WHERE {field} = null ORDER BY LastModifiedDate DESC LIMIT {limit}"}],"verdicts":[{"say":"{records.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["The field must be queryable and filterable; the object must support Id and LastModifiedDate.","Null is not the same as whitespace, a default value or a business-invalid value. No values are filled automatically."],"source":"tool","logged":0},{"id":"data.recent","question":"Which records of this object changed recently, and who changed them?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"days":{"type":"int","example":"1","default":"1"},"user":{"type":"username","example":"jane.doe@example.com","optional":true},"fields":{"type":"fields","example":"Id, Name, CreatedDate, LastModifiedDate","default":"Id, CreatedBy.Name, CreatedDate, LastModifiedBy.Name, LastModifiedDate"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"records","soql":"SELECT {fields} FROM {obj} WHERE LastModifiedDate = LAST_N_DAYS:{days} [[AND LastModifiedBy.Username = '{user}']] ORDER BY LastModifiedDate DESC LIMIT {limit}"}],"verdicts":[{"when":"records.rows === 0","say":"No {obj} changed in the last {days} day(s)."},{"say":"{records.rows} {obj} record(s) changed."}],"traps":["Integration users and automation also change records; LastModifiedBy names the user the change ran as."],"source":"tool","logged":0},{"id":"data.record","question":"What does this one record hold right now?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"id":{"type":"id","example":"001000000000000AAA"},"fields":{"type":"fields","example":"Id, Name, CreatedDate, LastModifiedDate","default":"Id, CreatedBy.Name, CreatedDate, LastModifiedBy.Name, LastModifiedDate"}},"safety":{"writes":false},"steps":[{"name":"record","compare":"*","soql":"SELECT {fields} FROM {obj} WHERE Id = '{id}'"}],"verdicts":[{"when":"record.rows === 0","say":"No {obj} {id}, or the running user cannot see it."},{"say":"{obj} {id} found."}],"traps":["Run with --fields to choose columns. Field access applies: a hidden field errors rather than reading blank."],"source":"tool","logged":0},{"id":"data.stale-records","question":"Which records have not been modified since before the selected window?","family":"data","params":{"obj":{"type":"sobject","example":"Account"},"days":{"type":"int","example":"90","default":"90"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"records","soql":"SELECT Id, LastModifiedDate, LastModifiedBy.Name FROM {obj} WHERE LastModifiedDate \u003c LAST_N_DAYS:{days} ORDER BY LastModifiedDate ASC LIMIT {limit}"}],"verdicts":[{"say":"{records.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["Old records can be valid reference or historical data. This is not a deletion list.","The object must support the selected modification fields; query limits may omit other records."],"source":"tool","logged":0},{"id":"flow.interviews","question":"Which flow interviews are paused or waiting on this org?","family":"flow","params":{"days":{"type":"int","example":"7","default":"7"},"label":{"type":"text","example":"Account","optional":true},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"interviews","soql":"SELECT Name, InterviewLabel, InterviewStatus, CurrentElement, PauseLabel, CreatedBy.Name, CreatedDate FROM FlowInterview WHERE CreatedDate = LAST_N_DAYS:{days} [[AND InterviewLabel LIKE '{label}%']] ORDER BY CreatedDate DESC LIMIT {limit}"}], , ActorId, OriginalActorId, CreatedDate, ElapsedTimeInDays FROM ProcessInstanceWorkitem WHERE ProcessInstance.Status = 'Pending' AND CreatedDate \u003c LAST_N_DAYS:{days} ORDER BY CreatedDate ASC LIMIT {limit}"}],"verdicts":[{"say":"{requests.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["Covers approval work items exposed by ProcessInstanceWorkitem, not every approval product or flow.","Elapsed age does not establish a missed service commitment. Oldest returned items may be limited."],"source":"tool","logged":0},{"id":"ops.scheduled-jobs","question":"Which scheduled jobs exist, who owns them, and when do they fire next?","family":"ops","params":{"name":{"type":"text","example":"%","default":"%"}},"safety":{"writes":false},"steps":[{"name":"jobs","compare":["CronJobDetail.Name","State","CronExpression","CreatedBy.Name"],"soql":"SELECT CronJobDetail.Name, CronJobDetail.JobType, State, CronExpression, NextFireTime, PreviousFireTime, TimesTriggered, CreatedBy.Name FROM CronTrigger WHERE CronJobDetail.Name LIKE '{name}' ORDER BY CronJobDetail.Name LIMIT 500"}],"verdicts":[{"when":"jobs.rows === 0","say":"No scheduled jobs matched {name}."},{"say":"{jobs.rows} scheduled job(s)."}],"traps":["A scheduled job runs as the user who scheduled it (CreatedBy).","A scheduled Apex class cannot be redeployed while its schedule exists."],"source":"tool","logged":0},{"id":"ops.setup-audit","question":"What changed in Setup recently, and who changed it?","family":"ops","params":{"days":{"type":"int","example":"7","default":"7"},"section":{"type":"text","example":"Manage Users","optional":true},"user":{"type":"username","example":"jane.doe@example.com","optional":true},"limit":{"type":"int","example":"100","default":"100"}},"safety":{"writes":false},"steps":[{"name":"changes","soql":"SELECT CreatedDate, CreatedBy.Name, Action, Section, Display, DelegateUser FROM SetupAuditTrail WHERE CreatedDate = LAST_N_DAYS:{days} [[AND Section = '{section}']] [[AND CreatedBy.Username = '{user}']] ORDER BY CreatedDate DESC LIMIT {limit}"}],"verdicts":[{"when":"changes.rows === 0","say":"No Setup changes matched in the last {days} day(s)."},{"say":"{changes.rows} Setup change(s)."}],"traps":["Deployments show up here under the deploying user, so a deploy and a hand edit can look alike; check ops.deploys at the same time."],"source":"tool","logged":0},{"id":"ops.test-queue","question":"Which Apex test queue items are waiting or processing?","family":"ops","params":{"days":{"type":"int","example":"7","default":"7"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"queue","soql":"SELECT Id, ApexClass.Name, Status, ExtendedStatus, CreatedDate FROM ApexTestQueueItem WHERE CreatedDate = LAST_N_DAYS:{days} AND Status IN ('Holding', 'Queued', 'Preparing', 'Processing') ORDER BY CreatedDate ASC LIMIT {limit}"}],"verdicts":[{"say":"{queue.rows} row(s) returned by the first query. Review selected columns, query limits and follow-up steps; this is not an org-wide assessment."}],"traps":["A pending state alone does not prove a stuck run. Older entries can fall outside the chosen window."],"source":"tool","logged":0},{"id":"ops.test-results","question":"How did the latest test runs of this class go?","family":"ops","params":{"apexclass":{"type":"name","example":"AccountServiceTest"},"limit":{"type":"int","example":"50","default":"50"}},"safety":{"writes":false},"steps":[{"name":"results","soql":"SELECT MethodName, Outcome, Message, RunTime, TestTimestamp, AsyncApexJobId FROM ApexTestResult WHERE ApexClass.Name = '{apexclass}' ORDER BY TestTimestamp DESC LIMIT {limit}"}],"verdicts":[{"when":"results.rows === 0","say":"No test results for {apexclass}."},{"when":"results.records.some(r => r.Outcome !== \"Pass\")","say":"{= results.records.filter(r => r.Outcome !== \"Pass\").length} of the latest {results.rows} result(s) did not pass."},{"say":"Latest {results.rows} result(s) all passed."}],"traps":[],"source":"tool","logged":0}]</script>
<script>
const PROBES = JSON.parse(document.getElementById('data').textContent);
const FAMILY_TEXT = {
  access: 'Who can see or do what', meta: 'What exists and who changed it', flow: 'Flow versions and runs',
  omni: 'OmniStudio components', ops: 'Jobs, deploys, logs, tests', data: 'Any object, any record',
};
const state = { q: '', families: new Set(), current: null, values: {}, org: 'dev', ticket: '' };
const $ = (s) => document.querySelector(s);
const workspaceHref = (path) => location.protocol === 'file:' ? 'https://probekit.orgparity.com' + path : path;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// One searchable text per probe: id, question, objects queried, params, traps, verdicts.
for (const p of PROBES) {
  const objects = p.steps.map((s) => (s.soql.match(/\bFROM\s+(\{?\w+\}?)/i) || [])[1]).filter(Boolean);
  p._objects = [...new Set(objects)];
  p._text = [p.id, p.question, p.family, ...p._objects, ...Object.keys(p.params),
    ...Object.values(p.params).map((x) => x.example), ...(p.traps || []), ...p.verdicts.map((v) => v.say),
    ...p.steps.map((s) => s.soql)].join(' ').toLowerCase();
}

function matches(p) {
  if (state.families.size && !state.families.has(p.family)) return false;
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  return terms.every((t) => p._text.includes(t));
}
function score(p) {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let s = 0;
  for (const t of terms) {
    if (p.id.toLowerCase().includes(t)) s += 4;
    if (p.question.toLowerCase().includes(t)) s += 3;
    if (p._objects.some((o) => o.toLowerCase().includes(t))) s += 3;
  }
  return s;
}
function highlight(text) {
  const terms = state.q.split(/\s+/).filter((t) => t.length > 1);
  let out = esc(text);
  for (const t of terms) out = out.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>');
  return out;
}

function renderFamilies() {
  const counts = {};
  for (const p of PROBES) counts[p.family] = (counts[p.family] || 0) + 1;
  $('#families').innerHTML = Object.keys(counts).sort().map((f) =>
    `<button class="chip" data-f="${f}" aria-pressed="${state.families.has(f)}" title="${esc(FAMILY_TEXT[f] || '')}">${f} ${counts[f]}</button>`).join('');
}

function renderList() {
  let rows = PROBES.filter(matches);
  rows.sort((a, b) => (state.q ? score(b) - score(a) : 0) ||
    a.id.localeCompare(b.id));
  $('#shown').textContent = `${rows.length} of ${PROBES.length}`;
  $('#list').innerHTML = rows.length ? rows.map((p) => `
    <button class="item" role="option" data-id="${p.id}" aria-current="${state.current === p.id}">
      <div class="id">${highlight(p.id)}</div>
      <div class="q">${highlight(p.question)}</div>
      <div class="meta"><span>${p._objects.map(esc).join(', ')}</span>${p.safety.writes ? '<span>writes</span>' : ''}</div>
    </button>`).join('') : '<div class="empty">No probe matches. Try an object name, like FieldPermissions or Flow.</div>';
  return rows;
}

// Mirror of the runner's template rules, for the preview only.
function renderSoql(tpl) {
  const v = state.values;
  const given = (k) => v[k] !== undefined && v[k] !== '';
  let out = tpl.replace(/\[\[(.*?)\]\]/gs, (m, frag) => {
    const keys = [...frag.matchAll(/\{(\w+)\}/g)].map((x) => x[1]);
    return keys.every(given) ? frag : '';
  }).replace(/\s+/g, ' ').trim();
  let html = esc(out)
    .replace(/\{@(\w+)\.([\w.]+)\}/g, '<span class="ref" title="values from step $1">&lt;$1.$2&gt;</span>')
    .replace(/\{(\w+)\}/g, (m, k) => (given(k) ? esc(v[k]) : `<span class="ph">{${k}}</span>`));
  html = html.replace(/\b(SELECT|FROM|WHERE|AND|OR|IN|NOT|LIKE|ORDER BY|GROUP BY|HAVING|LIMIT|DESC|ASC|COUNT|LAST_N_DAYS|null|true|false)\b/g, '<span class="kw">$1</span>');
  return { html, text: out };
}

function commandFor(p) {
  const parts = ['probe run', p.id, '--org', state.org || 'dev'];
  if (state.ticket) parts.push('--ticket', state.ticket);
  for (const [k, spec] of Object.entries(p.params)) {
    const val = state.values[k];
    if (val === undefined || val === '' || (spec.default !== undefined && val === spec.default)) {
      if (!spec.optional && spec.default === undefined) parts.push(`--${k}`, `<${k}>`);
      continue;
    }
    parts.push(`--${k}`, /[\s,%]/.test(val) ? `"${val}"` : val);
  }
  return parts.join(' ');
}

function renderDetail() {
  const p = PROBES.find((x) => x.id === state.current);
  if (!p) { $('#detail').innerHTML = '<p class="note">Pick a probe on the left.</p>'; return; }
  const params = Object.entries(p.params);
  $('#detail').innerHTML = `
    <div class="crumb">${esc(p.family)} / ${esc(FAMILY_TEXT[p.family] || '')}</div>
    <h2>${esc(p.question)}</h2>
    <p><a href="${workspaceHref('/investigations.html#' + p.id)}">Open guided investigation →</a></p>
    <div class="tags">
      <span class="tag" style="font-family:var(--mono)">${esc(p.id)}</span>
      <span class="tag ${p.safety.writes ? 'writes' : 'read'}">${p.safety.writes ? 'writes' : 'read-only'}</span>
      ${p.steps.some((s) => s.tooling) ? '<span class="tag">Tooling API</span>' : ''}
      ${p.rule ? `<span class="tag">${esc(p.rule)}</span>` : ''}
    </div>

    <section>
      <h3>Run it</h3>
      ${params.length ? `<div class="params">${params.map(([k, s]) => `
        <div class="param">
          <label for="p-${k}">--${k} <small>${esc(s.type)}${s.optional ? ', optional' : ''}${s.default !== undefined ? `, default ${esc(s.default)}` : ''}</small></label>
          <input id="p-${k}" data-k="${k}" value="${esc(state.values[k] ?? '')}" placeholder="${esc(s.example ?? '')}">
        </div>`).join('')}</div>` : '<p class="note">No parameters.</p>'}
      ${params.length ? '<button class="linkbtn" id="examples">Fill examples</button>' : ''}
      <div class="row">
        <label for="org">org</label><input id="org" value="${esc(state.org)}">
        <label for="ticket">ticket</label><input id="ticket" value="${esc(state.ticket)}" placeholder="optional">
      </div>
      <div class="codewrap" style="margin-top:10px"><pre id="cmd"></pre><button class="copy" data-copy="cmd">Copy</button></div>
    </section>

    <section>
      <h3>Steps</h3>
      ${p.steps.map((s, i) => `
        <div class="step">
          <div class="head"><span class="name">${i + 1}. ${esc(s.name)}</span>
            ${s.tooling ? '<span class="tag">Tooling API</span>' : ''}
            ${s.when ? `<span class="when">runs when <code>${esc(s.when)}</code></span>` : ''}
            ${s.hash ? `<span class="when">hashes ${esc(s.hash.join(', '))}</span>` : ''}
            ${s.compare ? `<span class="when">compares ${esc(s.compare === '*' ? 'every column' : s.compare.join(', '))}</span>` : ''}
          </div>
          <div class="codewrap"><pre id="soql-${i}"></pre><button class="copy" data-copy="soql-${i}">Copy</button></div>
        </div>`).join('')}
      <p class="note">Highlighted names still need a value. Shaded ones come from an earlier step when the probe runs.</p>
    </section>

    <section>
      <h3>What the answer means</h3>
      ${p.verdicts.map((v) => `<div class="verdict ${v.when ? '' : 'fallback'}">
        <div class="note">${v.when ? `when <code>${esc(v.when)}</code>` : 'otherwise'}</div>
        <div class="say">${esc(v.say)}</div></div>`).join('')}
    </section>

    ${p.traps?.length ? `<section><h3>Traps</h3><ul class="traps">${p.traps.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></section>` : ''}
  `;
  refreshCode(p);
}

function refreshCode(p) {
  $('#cmd').textContent = commandFor(p);
  p.steps.forEach((s, i) => { const el = $(`#soql-${i}`); if (el) { const r = renderSoql(s.soql); el.innerHTML = r.html; el.dataset.text = r.text; } });
}

function select(id, push = true) {
  if (state.current !== id) state.values = {};
  state.current = id;
  const p = PROBES.find((x) => x.id === id);
  if (p) for (const [k, s] of Object.entries(p.params)) if (state.values[k] === undefined) state.values[k] = s.default ?? '';
  if (push) history.replaceState(null, '', '#' + id);
  renderList();
  renderDetail();
}

$('#families').addEventListener('click', (e) => {
  const f = e.target.closest('.chip')?.dataset.f; if (!f) return;
  state.families.has(f) ? state.families.delete(f) : state.families.add(f);
  renderFamilies(); renderList();
});
$('#q').addEventListener('input', (e) => {
  state.q = e.target.value;
  const rows = renderList();
  if (rows.length && !rows.some((p) => p.id === state.current)) select(rows[0].id);
});
$('#list').addEventListener('click', (e) => { const id = e.target.closest('.item')?.dataset.id; if (id) select(id); });
$('#detail').addEventListener('input', (e) => {
  const p = PROBES.find((x) => x.id === state.current); if (!p) return;
  if (e.target.dataset.k) state.values[e.target.dataset.k] = e.target.value;
  if (e.target.id === 'org') state.org = e.target.value;
  if (e.target.id === 'ticket') state.ticket = e.target.value;
  refreshCode(p);
});
$('#detail').addEventListener('click', async (e) => {
  if (e.target.id === 'examples') {
    const p = PROBES.find((x) => x.id === state.current);
    for (const [k, s] of Object.entries(p.params)) if (!s.optional) state.values[k] = state.values[k] || s.default || s.example || '';
    renderDetail();
    return;
  }
  const btn = e.target.closest('.copy'); if (!btn) return;
  const el = document.getElementById(btn.dataset.copy);
  try { await navigator.clipboard.writeText(el.dataset.text ?? el.textContent); btn.textContent = 'Copied'; }
  catch { btn.textContent = 'Select and copy'; }
  setTimeout(() => (btn.textContent = 'Copy'), 1200);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && document.activeElement === $('#q')) {
    e.preventDefault();
    const ids = [...document.querySelectorAll('.item')].map((x) => x.dataset.id);
    const i = ids.indexOf(state.current) + (e.key === 'ArrowDown' ? 1 : -1);
    if (ids[i]) { select(ids[i]); document.querySelector(`.item[data-id="${ids[i]}"]`)?.scrollIntoView({ block: 'nearest' }); }
  }
});
$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('probekit-theme', root.dataset.theme); } catch {}
});
try { const t = localStorage.getItem('probekit-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

$('#count').textContent = `${PROBES.length} probes`;
if (location.protocol !== 'file:') document.querySelectorAll('a[href^="https://probekit.orgparity.com/"]').forEach((a) => { const u = new URL(a.href); a.setAttribute('href', u.pathname + u.search + u.hash); });
renderFamilies();
const first = PROBES.slice().sort((a, b) => a.id.localeCompare(b.id))[0];
select(PROBES.some((p) => p.id === location.hash.slice(1)) ? location.hash.slice(1) : first.id, false);
</script>
</body>
</html>
