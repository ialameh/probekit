name: Investigation request
description: Suggest a reusable Salesforce investigation.
title: "[Investigation] "
body:
  - type: markdown
    attributes:
      value: "This is a public request. Describe a generic question using fictional examples. Exclude client names, org details, credentials and real records."
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content check
      options:
        - label: This request contains no private information or real exports.
          required: true
  - type: textarea
    id: question
    attributes:
      label: What question should the investigation answer?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What evidence and next action would help?
      description: Describe the desired outcome and known limits using generic terms.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing investigations tried
      description: List relevant ProbeKit IDs and explain the missing capability.
