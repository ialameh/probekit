name: Bug report
description: Report a reproducible ProbeKit problem using fictional data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Issues are public. Do not include credentials, tokens, client names, org identifiers, real exports or screenshots containing private information. Reproduce the problem with fictional data."
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content check
      options:
        - label: I have removed private information and used only fictional examples.
          required: true
  - type: input
    id: version
    attributes:
      label: Version and interface
      placeholder: "Example: 0.5.0, browser / CLI / MCP"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the investigation ID and a minimal fictional example, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser and OS versions; Node.js version for CLI/MCP"
